# Conda environment for both Day 4 practices (Genomic Data Processing, 10/15):
#   Practice 1 · variant calling in a trio, and Practice 2 · CNVs, liftover and TESSERACT-CNV input.
# Create once: conda env create -f environment.yml      (or: mamba env create -f environment.yml)
# Activate:    conda activate d4-practice
# Already created for the other practice? Skip the create step and just activate it.
# Versions are the ones used to build and test both practices (October 2026).
# jupyterlab is not part of the tested build environment; any JupyterLab 4.x works.
name: d4-practice
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  # command-line tools
  - samtools=1.24
  - bcftools=1.24
  - htslib=1.24          # bgzip, tabix
  - minimap2=2.31
  - bwa=0.7.19
  - bedtools=2.31.1
  - fastp=1.4.0
  - crossmap=0.7.4
  # Python packages
  - pysam=0.24.1
  - pandas=3.0.6
  - numpy=2.5.4
  - scipy=1.18.1
  - matplotlib=3.11.2
  - pillow=12.3.0
  - requests=2.34.2
  - nbformat=5.11.1
  - nbconvert=7.17.2
  - ipykernel=7.4.0
  - jupyterlab>=4,<5
